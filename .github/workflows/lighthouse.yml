name: Lighthouse Report

on:
  schedule:
    - cron: '0 3 * * *'  # каждую ночь в 03:00 UTC (06:00 MSK)
  workflow_dispatch:
    inputs:
      url:
        description: 'URL для проверки (по умолчанию — Render)'
        required: true
        default: 'https://ai-for-developers-project-387.onrender.com/'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set target URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.url }}" ]; then
            TARGET="${{ github.event.inputs.url }}"
          else
            # для schedule и на случай пустого input
            TARGET="https://ai-for-developers-project-387.onrender.com/"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.url.outputs.target }}
          uploadArtifacts: true
          artifactName: lighthouse-report
          temporaryPublicStorage: true
        id: lighthouse

      - name: Print summary
        run: |
          echo "## Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.url.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Отчёт доступен во вкладке **Artifacts** → \`lighthouse-report\`" >> $GITHUB_STEP_SUMMARY
